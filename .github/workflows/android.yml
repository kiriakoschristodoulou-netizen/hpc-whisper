# Builds the Android app on every change and publishes it, with the handheld
# program, as a release that anyone can download.
name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Free Pascal (for the handheld sender)
        run: sudo apt-get update -q && sudo apt-get install -y -q fpc
      - name: Sender, page receiver and keyboard receiver, checked against each other
        working-directory: tests
        run: |
          mkdir -p linux
          fpc -O2 -Fu../handheld -Fi../handheld -FUlinux wmsim.pas
          mkdir -p java/classes
          javac -d java/classes ../android/app/src/main/java/net/kyriakos/whisper/Receiver.java ../android/app/src/main/java/net/kyriakos/whisper/Mirror.java java/Decode.java
          node test_rs.js
          node test_frames.js
          node test_gap.js
          node test_noise.js
          node test_java.js
          node test_sync.js
      - name: Typing and loss tests
        working-directory: tests
        run: |
          fpc -O2 -Fu../handheld -Fi../handheld -FUlinux -olosssim losssim.pas
          ./losssim 0 0 100
          ./losssim 10 0 100
          fpc -O2 -Fu../handheld -FUlinux -oscansim scansim.pas
          fpc -O2 -Fu../handheld -FUlinux -oretsim retsim.pas
          node test_scan.js
          node test_return.js
          fpc -O2 -Fu../handheld -FUlinux -oacksim acksim.pas
          fpc -O2 -Fu../handheld -FUlinux -ohashsim hashsim.pas
          node test_ack.js
          node test_ack_java.js
          ./losssim 10 0 100 6 10
          mkdir -p writer/cls && javac -d writer/cls $(find writer/stubs -name "*.java") ../android/app/src/main/java/net/kyriakos/whisper/{Writer,Mirror,Keys,Receiver,DiagLog}.java writer/WriterTest.java
          java -cp writer/cls WriterTest writer/writer-frames.txt

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the Android app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon 2>&1 | tee build.log || {
            # the errors as annotations (readable without downloading the log)
            grep -E "error:|\.java:[0-9]+|What went wrong|AAPT|Execution failed" build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }

      - name: Collect the files
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk out/HPC-Whisper.apk
          cp handheld/HPC-Whisper-11.zip handheld/Mic-Scan-13.zip out/

      - uses: actions/upload-artifact@v4
        with:
          name: Whisper-Tools
          path: out/*

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HPC Whisper (build ${{ github.run_number }})
          make_latest: 'true'
          body: |
            **HPC-Whisper.apk** – the Android keyboard: what you type on the handheld appears in any app.
            **HPC-Whisper-11.zip** – the program for Windows CE handhelds with an ARM processor, such as the HP Jornada 720 (copy the folder to the handheld and run HPCWhisper.exe).
            **Mic-Scan-13.zip** – a separate tool for the handheld that measures how its microphone hears sound (test sound: https://kiriakoschristodoulou-netizen.github.io/hpc-whisper/scan.html) and whether it can decode data sent by the phone (https://kiriakoschristodoulou-netizen.github.io/hpc-whisper/return.html).
            On an iPhone (Apple does not let keyboards use the microphone) or any other phone, use the receiver page: https://kiriakoschristodoulou-netizen.github.io/hpc-whisper/
          files: out/*
