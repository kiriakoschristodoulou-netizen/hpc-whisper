# Builds the Android app on every change and publishes it, with the handheld
# program, as a release that anyone can download.
name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the Android app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Collect the files
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk out/HPC-Whisper.apk
          cp handheld/HPC-Whisper-10.zip out/

      - uses: actions/upload-artifact@v4
        with:
          name: HPC-Whisper
          path: out/*

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HPC Whisper (build ${{ github.run_number }})
          make_latest: 'true'
          body: |
            **HPC-Whisper.apk** – the receiver as an Android app (works with no internet).
            **HPC-Whisper-10.zip** – the program for Windows CE handheld PCs with an ARM processor, such as the HP Jornada 720 (copy the folder inside to the handheld).
            The receiver also runs in Chrome at https://kiriakoschristodoulou-netizen.github.io/hpc-whisper/
          files: out/*
