# Builds the Android app on every change and publishes it, with the handheld
# program, as a release that anyone can download.
name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Free Pascal (for the handheld's sender)
        run: sudo apt-get update -q && sudo apt-get install -y -q fpc
      - name: Sender, page receiver and keyboard receiver, checked against each other
        working-directory: tests
        run: |
          mkdir -p linux
          fpc -O2 -Fu../handheld -Fi../handheld -FUlinux wmsim.pas
          mkdir -p java/classes
          javac -d java/classes ../android/app/src/main/java/net/kyriakos/whisper/Receiver.java ../android/app/src/main/java/net/kyriakos/whisper/Mirror.java java/Decode.java
          node test_rs.js
          node test_frames.js
          node test_gap.js
          node test_noise.js
          node test_java.js
          node test_sync.js
      - name: Format 3 (the handheld's Pascal and the phone's Java against each other)
        working-directory: tests/w3
        run: |
          mkdir -p linux cls
          javac -d cls ../../android/app/src/main/java/net/kyriakos/whisper/w3/*.java ../../android/app/src/main/java/net/kyriakos/whisper/{Receiver,Mirror,Keys,TextLink,Adpcm,DiagLog}.java $(ls *.java | grep -v WriterTest)
          fpc -O2 -Fu../../handheld -Fi../../handheld -FUlinux -olinux/w3tool w3tool.pas
          fpc -O2 -Fu../../handheld -FUlinux -olinux/filetest filetest.pas
          fpc -O2 -Fu../../handheld -FUlinux -olinux/texttool texttool.pas
          fpc -O2 -Fu../../handheld -FUlinux -olinux/mediatest mediatest.pas
          fpc -O2 -Fu../../handheld -Fi../../handheld -FUlinux -olinux/pairtool pairtool.pas
          ./cross.sh
          java -cp cls FileTest
          ./linux/filetest
          java -cp cls ScreenTest
          java -cp cls TextTest linux/texttool
          java -cp cls PairTest
          java -cp cls TurnTest
          java -cp cls LevelTest
          ./linux/pairtool turn turn.wav && java -cp cls LadderTest turn.wav
          java -cp cls AudibleTest linux/w3tool
          mkdir -p clsw && javac -d clsw $(find stubs -name "*.java") ../../android/app/src/main/java/net/kyriakos/whisper/{Writer,Mirror,Keys,TextLink,Receiver,DiagLog}.java ../../android/app/src/main/java/net/kyriakos/whisper/w3/Channel.java WriterTest.java && java -cp clsw WriterTest writer-frames.txt
          mkdir -p m && java -cp cls ScreenDump m && java -cp cls AdpcmTest 8000 m/a.wav && ./linux/mediatest m m/a.wav

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the Android app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon 2>&1 | tee build.log || {
            # the errors as annotations (readable without downloading the log)
            grep -E "error:|\.java:[0-9]+|What went wrong|AAPT|Execution failed" build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }

      - name: Collect the files
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk out/Whisper-Tools.apk
          cp handheld/Whisper-Tools-37.zip out/

      - uses: actions/upload-artifact@v4
        with:
          name: Whisper-Tools
          path: out/*

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Whisper Tools (build ${{ github.run_number }})
          make_latest: 'true'
          body: |
            **Whisper-Tools.apk** – Whisper Tools for Android: the keyboard (type on the handheld straight into any app, with all keys), files both ways, and the picture remote.
            **Whisper-Tools-37.zip** – Whisper Tools for Windows CE handheld PCs with an ARM processor, such as the HP Jornada 720 (copy the folder inside to the handheld and run WhisperTools.exe).
            On an iPhone (Apple does not let keyboards use the microphone) or any other phone, use the receiver page: https://kiriakoschristodoulou-netizen.github.io/hpc-whisper/
          files: out/*
